name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked

      - name: Security audit
        run: cargo audit
