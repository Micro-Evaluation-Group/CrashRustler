name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked

      - name: Security audit
        run: cargo audit
