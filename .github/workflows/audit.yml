name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked

      - name: Security audit
        run: cargo audit
